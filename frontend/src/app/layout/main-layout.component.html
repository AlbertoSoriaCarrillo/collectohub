<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/dashboard">CollectoHub</a>

  <nav class="nav-links" aria-label="Navegacion principal">
    @if (authService.isAuthenticated()) {
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
    }
  </nav>

  <span class="toolbar-spacer"></span>

  @if (authService.isAuthenticated()) {
    <span class="session-label">{{ authService.currentUser()?.displayName || 'Sesion activa' }}</span>
    <button mat-stroked-button type="button" (click)="logout()">Logout</button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active-link">Login</a>
    <a mat-flat-button routerLink="/register" routerLinkActive="active-link">Registro</a>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
