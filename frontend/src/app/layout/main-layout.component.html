<mat-toolbar class="app-toolbar" data-testid="app-toolbar">
  <a class="brand" routerLink="/dashboard" data-testid="app-brand">CollectoHub</a>

  <nav class="nav-links" aria-label="Navegacion principal">
    <a mat-button routerLink="/catalog" routerLinkActive="active-link">Catalogo</a>
    @if (authService.isAuthenticated()) {
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
      <a mat-button routerLink="/shops" routerLinkActive="active-link">Mis tiendas</a>
      <a mat-button routerLink="/recommendations" routerLinkActive="active-link">
        Recomendaciones
      </a>
      <a mat-button routerLink="/reservations" routerLinkActive="active-link">Mis reservas</a>
    }
  </nav>

  <span class="toolbar-spacer"></span>

  @if (authService.isAuthenticated()) {
    <span class="session-label" data-testid="session-label">
      {{ authService.currentUser()?.displayName || 'Sesion activa' }}
    </span>
    <button mat-stroked-button type="button" (click)="logout()" data-testid="logout-button">
      Logout
    </button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active-link" data-testid="login-link">
      Login
    </a>
    <a
      mat-flat-button
      routerLink="/register"
      routerLinkActive="active-link"
      data-testid="register-link"
    >
      Registro
    </a>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
