spring:
  application:
    name: collectohub-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: ${BACKEND_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
