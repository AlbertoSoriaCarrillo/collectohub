name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-policy:
    name: quality-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "$base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Require quality policy files
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/32_QUALITY_GATES.md
          test -f docs/33_GITHUB_MAIN_PROTECTION.md
          test -f docs/templates/EPIC_QUALITY_EVIDENCE.md
          test -f scripts/quality/verify.ps1
          test -f .github/pull_request_template.md

      - name: Check diff policy
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          git diff --check $env:BASE_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

          $conflicts = @(git diff --name-only --diff-filter=U)
          if ($conflicts.Count -gt 0) { throw "Unresolved conflicts: $($conflicts -join ', ')" }

          $deletedTests = @(git diff --name-status --diff-filter=D $env:BASE_SHA -- | ForEach-Object {
            $parts = $_ -split "`t", 2
            if ($parts.Count -eq 2 -and $parts[1] -match '(?i)(Test\.java|IT\.java|\.spec\.ts)$') { $parts[1] }
          })
          if ($deletedTests.Count -gt 0) { throw "Deleted tests: $($deletedTests -join ', ')" }

          $pattern = '@Disabled|@Ignore|\.skip\s*\(|\b(?:xit|xdescribe)\s*\(|\b(?:test|it)\.todo\s*\(|-DskipTests\b|maven\.test\.skip|--passWithNoTests\b'
          $path = ''
          $violations = @()
          git diff --unified=0 $env:BASE_SHA -- | ForEach-Object {
            $line = $_
            if ($line -match '^diff --git a/(.+) b/(.+)$') {
              $path = $Matches[2]
            } elseif ($line -match '^\+(?!\+\+)' -and
              $path -notlike 'docs/*' -and
              $path -ne 'AGENTS.md' -and
              $path -ne '.github/pull_request_template.md' -and
              $path -ne '.github/workflows/quality-gates.yml' -and
              $path -notlike 'scripts/quality/*' -and
              $line.Substring(1) -match $pattern) {
              $violations += "$path`: $($line.Substring(1))"
            }
          }
          if ($violations.Count -gt 0) { throw "New ignored-test markers or skip flags: $($violations -join ' | ')" }

  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend verification
        working-directory: backend
        run: ./mvnw clean verify

      - name: Upload backend reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 7

  frontend-verify:
    name: frontend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align npm with packageManager
        run: npm install --global npm@11.9.0

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-build
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  powershell-parse:
    name: powershell-parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $failures = @()
          Get-ChildItem scripts -Recurse -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += "$($_.FullName): $($errors.Message -join '; ')"
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
