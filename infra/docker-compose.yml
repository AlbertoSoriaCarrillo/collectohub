services:
  postgres:
    image: postgres:17
    container_name: collectohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collectohub}
      POSTGRES_USER: ${POSTGRES_USER:-collectohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collectohub_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - collectohub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collectohub} -d ${POSTGRES_DB:-collectohub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collectohub

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: collectohub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - collectohub

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: collectohub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - collectohub

volumes:
  collectohub_postgres_data:

networks:
  collectohub:
    name: collectohub-network
